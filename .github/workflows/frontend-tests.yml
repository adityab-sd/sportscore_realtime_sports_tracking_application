name: frontend-tests

on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # TZ is pinned here so timezone bugs can't hide behind a developer's
      # local clock. CI runs UTC by default; the date-only off-by-one only
      # surfaces west of UTC, so we force a negative-offset zone.
      - run: npm run test:cov